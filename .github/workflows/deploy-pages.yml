name: Deploy examples to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; cancel in-progress runs for newer pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The examples typecheck (`tsc`) follows imports into the library source
      # at ../src, so the root dependencies (react, lucide-react, …) must be
      # installed too — otherwise those modules don't resolve and the build fails.
      - name: Install library (root) dependencies
        working-directory: ${{ github.workspace }}
        run: npm install

      - name: Install dependencies
        run: npm install

      - name: Build examples site
        # base path for https://<user>.github.io/gofi-ui/
        env:
          PAGES_BASE: /gofi-ui/
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
